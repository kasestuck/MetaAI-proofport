<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Proofport Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111827'/%3E%3Cpath d='M9 23V9h8a5 5 0 0 1 0 10h-4' fill='none' stroke='%234F8CFF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <!-- Sidebar navigation. Routes are hash based (#/overview) because the
         backend serves this folder as static files without an SPA fallback. -->
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M9 23V9h8a5 5 0 0 1 0 10h-4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Proofport</span>
          <span class="brand-sub">Modernization &amp; Security</span>
        </span>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/overview" data-route="overview"><span class="nav-icon" data-icon="overview"></span><span class="nav-label">Overview</span></a>
        <a class="nav-item" href="#/migration" data-route="migration"><span class="nav-icon" data-icon="migration"></span><span class="nav-label">Migration</span></a>
        <a class="nav-item" href="#/security" data-route="security"><span class="nav-icon" data-icon="security"></span><span class="nav-label">Security</span><span class="nav-count" id="nav-security-count" hidden></span></a>
        <a class="nav-item" href="#/compatibility" data-route="compatibility"><span class="nav-icon" data-icon="compatibility"></span><span class="nav-label">Compatibility</span></a>
        <a class="nav-item" href="#/evidence" data-route="evidence"><span class="nav-icon" data-icon="evidence"></span><span class="nav-label">Evidence</span></a>
      </nav>

      <div class="sidebar-foot">
        <div class="conn" id="conn" data-state="unknown">
          <span class="dot" aria-hidden="true"></span>
          <span class="conn-text" id="conn-text">Connecting…</span>
        </div>
        <div class="sidebar-meta">Same-origin API · no external requests</div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">Overview</h1>
          <p id="view-sub" class="muted">System status and current run</p>
        </div>
        <div class="topbar-status">
          <!-- Live / Mock / Replay: exactly one segment is active. -->
          <div class="mode-switch" id="mode-switch" role="status" aria-label="AI execution mode">
            <span class="mode-seg" data-mode="live">Live</span>
            <span class="mode-seg" data-mode="mock">Mock</span>
            <span class="mode-seg" data-mode="replay">Replay</span>
          </div>
          <div class="run-chip" id="run-chip" hidden></div>
        </div>
      </header>

      <!-- Persistent honesty banners (offline backend, Meta not connected, simulation, replay). -->
      <div class="banners" id="banners" aria-live="polite"></div>

      <main id="main" class="content" tabindex="-1">
        <section class="view" data-view="overview" aria-labelledby="view-title"></section>
        <section class="view" data-view="migration" aria-labelledby="view-title" hidden></section>
        <section class="view" data-view="security" aria-labelledby="view-title" hidden></section>
        <section class="view" data-view="compatibility" aria-labelledby="view-title" hidden></section>
        <section class="view" data-view="evidence" aria-labelledby="view-title" hidden></section>
      </main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <!-- Classic scripts in dependency order (no bundler, no ES module MIME
       requirements). Every file attaches to the single global `PP`. -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/integrity.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views/shared.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/migration.js"></script>
  <script src="js/views/security.js"></script>
  <script src="js/views/compatibility.js"></script>
  <script src="js/views/evidence.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
